<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SODRON.XOON</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #070b0f;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            padding: 16px;
        }

        /* === Background minimal === */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at 30% 40%, #0d1f2c, #04080b);
        }
        .bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 70% 80%, rgba(0, 180, 255, 0.04), transparent 60%);
        }

        /* === BUTTONS === */
        .buttons {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 100%;
            max-width: 320px;
        }

        .btn {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50px;
            padding: 1.5px;
            background: linear-gradient(135deg, rgba(0, 234, 255, 0.3), rgba(255, 59, 129, 0.2));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            -webkit-mask-composite: xor;
            pointer-events: none;
            transition: 0.4s;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }
        .btn:active {
            transform: scale(0.97);
        }

        .btn-open {
            color: #aaffff;
            text-shadow: 0 0 20px rgba(0, 234, 255, 0.15);
        }
        .btn-open:hover {
            background: rgba(0, 234, 255, 0.06);
            box-shadow: 0 0 30px rgba(0, 234, 255, 0.08), 0 8px 30px rgba(0, 0, 0, 0.4);
        }
        .btn-open i {
            color: #00eaff;
            font-size: 18px;
        }

        .btn-game {
            color: #ffb3cc;
            text-shadow: 0 0 20px rgba(255, 59, 129, 0.12);
        }
        .btn-game:hover {
            background: rgba(255, 59, 129, 0.05);
            box-shadow: 0 0 30px rgba(255, 59, 129, 0.06), 0 8px 30px rgba(0, 0, 0, 0.4);
        }
        .btn-game i {
            color: #ff3b81;
            font-size: 18px;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
        }

        /* === BACKDROP === */
        .backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease;
            z-index: 10;
        }
        .backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* === FRAME === */
        .frame {
            position: fixed;
            width: min(94vw, 920px);
            height: min(80vh, 640px);
            overflow: hidden;
            background: #0c121a;
            border-radius: 28px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
            opacity: 0;
            transform: scale(0.85) translateY(20px);
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 20;
        }
        .frame.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        /* === CLOSE === */
        .close-btn {
            position: absolute;
            right: 18px;
            top: 18px;
            z-index: 200;
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(6px);
            color: #ff8aa8;
            font-size: 18px;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 1px rgba(255, 59, 129, 0.1);
        }
        .close-btn:hover {
            background: #ff3b81;
            color: #fff;
            box-shadow: 0 0 25px rgba(255, 59, 129, 0.3);
            transform: rotate(90deg);
        }

        /* === SCENE === */
        .scene {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a1017;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        /* subtle glow */
        .scene-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 40% 50%, rgba(0, 180, 255, 0.04), transparent 70%);
            z-index: 0;
        }

        /* intro text */
        .intro {
            position: relative;
            z-index: 10;
            text-align: center;
            opacity: 0;
            animation: fadeIntro 14s ease-in-out infinite;
        }
        .intro span {
            display: block;
            color: #8ab8d9;
            font-size: clamp(14px, 2.8vw, 32px);
            font-weight: 300;
            letter-spacing: clamp(6px, 2vw, 18px);
            text-transform: uppercase;
        }
        .intro .sub {
            font-size: clamp(10px, 1vw, 14px);
            letter-spacing: 4px;
            color: #4a6a80;
            margin-top: 6px;
            font-weight: 200;
        }

        /* name */
        .name {
            position: relative;
            z-index: 9;
            text-align: center;
            opacity: 0;
            animation: namePop 14s cubic-bezier(0.16, 1, 0.3, 1) infinite;
            margin-top: -6px;
        }
        .name h1 {
            position: relative;
            margin: 0;
            color: #eef7ff;
            font-size: clamp(60px, 16vw, 180px);
            font-weight: 900;
            line-height: 0.92;
            letter-spacing: clamp(1px, 0.8vw, 10px);
            text-shadow: 0 0 40px rgba(0, 150, 255, 0.08);
        }
        .name h1::after {
            content: 'SODRON';
            position: absolute;
            inset: 0;
            color: transparent;
            background: linear-gradient(110deg, transparent 20%, rgba(255, 255, 255, 0.2) 35%, #fff 48%, rgba(255, 255, 255, 0.2) 62%, transparent 80%);
            background-size: 280% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            animation: shine 2.8s linear infinite;
        }
        @keyframes shine {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        /* wave ring (lebih halus) */
        .wave-ring {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border: 1.5px solid rgba(0, 234, 255, 0.08);
            border-radius: 50%;
            z-index: 4;
            opacity: 0;
            animation: waveRing 14s ease-out infinite;
        }
        .wave-ring::before {
            content: '';
            position: absolute;
            inset: -6px;
            border: 1.5px solid rgba(255, 59, 129, 0.05);
            border-radius: 50%;
            animation: innerRing 14s ease-out infinite;
        }
        @keyframes waveRing {
            0%,
            10% {
                opacity: 0;
                width: 20px;
                height: 20px;
            }
            13% {
                opacity: 0.7;
                width: 50px;
                height: 50px;
            }
            28% {
                opacity: 0;
                width: 140vmax;
                height: 140vmax;
            }
            100% {
                opacity: 0;
            }
        }
        @keyframes innerRing {
            0%,
            10% {
                transform: scale(0.2);
                opacity: 0;
            }
            13% {
                transform: scale(1);
                opacity: 0.6;
            }
            28% {
                transform: scale(12);
                opacity: 0;
            }
            100% {
                opacity: 0;
            }
        }

        /* particles (lebih sedikit & ringan) */
        .particles {
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            left: 50%;
            top: 50%;
            border-radius: 50%;
            background: #8ac4ff;
            opacity: 0;
            animation: particleFly 14s cubic-bezier(0.1, 0.8, 0.2, 1) infinite;
            will-change: transform, opacity;
        }
        @keyframes particleFly {
            0%,
            10% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.2);
            }
            13% {
                opacity: 0.9;
            }
            20% {
                opacity: 0.7;
            }
            38% {
                opacity: 0;
                transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(0);
            }
            100% {
                opacity: 0;
            }
        }

        /* flash (lebih subtle) */
        .flash {
            position: absolute;
            inset: 0;
            z-index: 20;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.6), transparent 70%);
            opacity: 0;
            pointer-events: none;
            animation: flashPop 14s ease-out infinite;
        }
        @keyframes flashPop {
            0%,
            10% {
                opacity: 0;
            }
            13% {
                opacity: 0.25;
            }
            15.5% {
                opacity: 0;
            }
            100% {
                opacity: 0;
            }
        }

        /* vignette */
        .vignette {
            position: absolute;
            inset: 0;
            z-index: 15;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.3) 100%);
            opacity: 0;
            animation: vignetteIn 14s ease-in-out infinite;
        }
        @keyframes vignetteIn {
            0%,
            10% {
                opacity: 0;
            }
            16%,
            82% {
                opacity: 1;
            }
            90%,
            100% {
                opacity: 0;
            }
        }

        /* animasi intro & name */
        @keyframes fadeIntro {
            0% {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(8px);
            }
            10% {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(8px);
            }
            14% {
                opacity: 1;
                transform: translateY(-4px);
                filter: blur(0);
            }
            18%,
            82% {
                opacity: 1;
                transform: translateY(-6px);
                filter: blur(0);
            }
            90% {
                opacity: 0;
                transform: translateY(-30px);
                filter: blur(10px);
            }
            100% {
                opacity: 0;
                transform: translateY(-30px);
                filter: blur(10px);
            }
        }
        @keyframes namePop {
            0% {
                opacity: 0;
                transform: scale(0.3) rotateX(20deg);
                filter: blur(20px);
            }
            10% {
                opacity: 0;
                transform: scale(0.3) rotateX(20deg);
                filter: blur(20px);
            }
            14% {
                opacity: 1;
                transform: scale(1.15);
                filter: blur(0);
            }
            16% {
                transform: scale(0.96);
            }
            18% {
                transform: scale(1.02);
            }
            20%,
            82% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
            90% {
                opacity: 0;
                transform: scale(1.2);
                filter: blur(18px);
            }
            100% {
                opacity: 0;
                transform: scale(1.2);
                filter: blur(18px);
            }
        }

        /* === IFRAME GAME === */
        #gameFrame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
            z-index: 2;
            display: none;
        }

        /* === RESPONSIVE === */
        @media (max-width: 640px) {
            .frame {
                width: 96vw;
                height: 78vh;
                border-radius: 20px;
            }
            .btn {
                padding: 14px 16px;
                font-size: 15px;
                letter-spacing: 2px;
            }
            .name h1 {
                font-size: 18vw;
            }
            .intro span {
                font-size: 14px;
                letter-spacing: 5px;
            }
            .close-btn {
                width: 36px;
                height: 36px;
                right: 12px;
                top: 12px;
                font-size: 15px;
            }
            .buttons {
                gap: 14px;
                max-width: 280px;
            }
        }

        @media (max-width: 400px) {
            .btn {
                padding: 12px 12px;
                font-size: 13px;
                letter-spacing: 1.5px;
                border-radius: 40px;
            }
            .btn i {
                font-size: 14px !important;
            }
            .frame {
                height: 70vh;
                border-radius: 16px;
            }
        }

        /* dot dekorasi */
        .deco-dots {
            position: absolute;
            bottom: 16px;
            right: 20px;
            z-index: 6;
            display: flex;
            gap: 6px;
            opacity: 0.15;
        }
        .deco-dots span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #00eaff;
            animation: pulseDot 3s ease-in-out infinite alternate;
        }
        .deco-dots span:nth-child(2) {
            background: #ff3b81;
            animation-delay: 0.6s;
        }
        .deco-dots span:nth-child(3) {
            background: #b300ff;
            animation-delay: 1.2s;
        }
        @keyframes pulseDot {
            0% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }
    </style>
</head>
<body>

    <div class="bg"></div>

    <div class="buttons">
        <button class="btn btn-open" onclick="openFrame()">
            <i class="fas fa-play-circle"></i> OPEN
        </button>
        <div class="divider"></div>
        <button class="btn btn-game" onclick="openGame()">
            <i class="fas fa-gamepad"></i> GAMES
        </button>
    </div>

    <div class="backdrop" id="backdrop"></div>

    <div class="frame" id="frame">
        <button class="close-btn" onclick="closeFrame()">
            <i class="fas fa-times"></i>
        </button>

        <div class="scene" id="scene">
            <div class="scene-glow"></div>
            <div class="flash"></div>
            <div class="intro">
                <span>MY NAME IS</span>
                
            </div>
            <div class="name"><h1>SODRON</h1></div>
            <div class="wave-ring"></div>
            <div class="particles" id="particles"></div>
            <div class="vignette"></div>
            <div class="deco-dots"><span></span><span></span><span></span></div>
        </div>

        <iframe id="gameFrame" allow="autoplay; fullscreen"></iframe>
    </div>

    <audio id="introMusic" preload="auto" loop>
        <source src="musik.mp3" type="audio/mpeg">
    </audio>

    <script>
        (function() {
            const frame = document.getElementById('frame');
            const backdrop = document.getElementById('backdrop');
            const scene = document.getElementById('scene');
            const gameFrame = document.getElementById('gameFrame');
            const introMusic = document.getElementById('introMusic');

            // === FUNGSI GLOBAL ===
            window.openFrame = function() {
                scene.style.display = 'flex';
                gameFrame.style.display = 'none';
                gameFrame.src = '';
                frame.classList.add('active');
                backdrop.classList.add('active');
                introMusic.currentTime = 0;
                introMusic.play().catch(function() {});
            };

            window.openGame = function() {
                scene.style.display = 'none';
                gameFrame.style.display = 'block';
                gameFrame.src = 'https://xexmxsdrnx.github.io';
                frame.classList.add('active');
                backdrop.classList.add('active');
                introMusic.pause();
                introMusic.currentTime = 0;
            };

            window.closeFrame = function() {
                frame.classList.remove('active');
                backdrop.classList.remove('active');
                gameFrame.src = '';
                gameFrame.style.display = 'none';
                scene.style.display = 'flex';
                introMusic.pause();
                introMusic.currentTime = 0;
            };

            // backdrop & escape
            backdrop.addEventListener('click', window.closeFrame);
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') window.closeFrame();
            });

            // === PARTICLES (lebih ringan, 90 partikel) ===
            const container = document.getElementById('particles');
            const colors = ['#00eaff', '#ff3b81', '#b300ff', '#ffcc00', '#6ac8ff'];

            for (let i = 0; i < 90; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const angle = Math.random() * Math.PI * 2;
                const dist = 100 + Math.random() * 600;
                const x = Math.cos(angle) * dist;
                const y = Math.sin(angle) * dist;
                p.style.setProperty('--x', x + 'px');
                p.style.setProperty('--y', y + 'px');
                const size = 2 + Math.random() * 5;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.boxShadow = '0 0 6px ' + p.style.background;
                p.style.animationDelay = (Math.random() * 0.2) + 's';
                container.appendChild(p);
            }
        })();
    </script>
</body>
</html>
