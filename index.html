<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SODRON.XOON</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #050505;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

/* =========================================
   KUMPULAN BUTTON
========================================= */

.buttons {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    z-index: 5;
}


/* =========================================
   BUTTON OPEN
========================================= */

.open-btn {
    position: relative;
    padding: 16px 40px;
    border: 1px solid #00eaff;
    border-radius: 12px;
    background: linear-gradient(135deg, #07151c, #001f29);
    color: #00eaff;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 3px;
    cursor: pointer;

    box-shadow:
        0 0 10px #00eaff,
        inset 0 0 15px rgba(0,234,255,.15);

    transition: .3s;
}

.open-btn:hover {
    transform: scale(1.08);

    box-shadow:
        0 0 20px #00eaff,
        0 0 50px rgba(0,234,255,.5);
}


/* =========================================
   BUTTON GAME
========================================= */

.game-btn {
    position: relative;
    padding: 16px 40px;

    border: 1px solid #ff3b81;
    border-radius: 12px;

    background: linear-gradient(
        135deg,
        #210914,
        #300019
    );

    color: #ff3b81;

    font-size: 18px;
    font-weight: bold;
    letter-spacing: 3px;

    cursor: pointer;

    box-shadow:
        0 0 10px #ff3b81,
        inset 0 0 15px rgba(255,59,129,.15);

    transition: .3s;
}

.game-btn:hover {
    transform: scale(1.08);

    background: #ff3b81;
    color: #fff;

    box-shadow:
        0 0 20px #ff3b81,
        0 0 50px rgba(255,59,129,.5);
}


/* =========================================
   BACKDROP
========================================= */

.backdrop {
    position: fixed;
    inset: 0;

    background: rgba(0,0,0,.8);
    backdrop-filter: blur(8px);

    opacity: 0;
    pointer-events: none;

    transition: .5s;

    z-index: 10;
}

.backdrop.active {
    opacity: 1;
    pointer-events: auto;
}


/* =========================================
   FRAME
========================================= */

.frame {
    position: fixed;

    width: min(94vw, 900px);
    height: min(80vh, 600px);

    overflow: hidden;

    background: #fff;

    border: 1px solid #00eaff;
    border-radius: 20px;

    box-shadow:
        0 0 10px #00eaff,
        0 0 40px rgba(0,234,255,.4),
        inset 0 0 40px rgba(0,234,255,.08);

    opacity: 0;

    transform:
        scale(.5)
        rotateX(70deg);

    pointer-events: none;

    transition:
        opacity .5s ease,
        transform .7s cubic-bezier(.17,.67,.18,1.25);

    z-index: 20;
}

.frame.active {
    opacity: 1;

    transform:
        scale(1)
        rotateX(0);

    pointer-events: auto;
}


/* =========================================
   GARIS FRAME
========================================= */

.frame::before {
    content: "";

    position: absolute;
    inset: 0;

    border: 2px solid transparent;
    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00eaff,
            transparent
        ) border-box;

    mask:
        linear-gradient(#000 0 0) padding-box,
        linear-gradient(#000 0 0);

    mask-composite: exclude;

    pointer-events: none;

    z-index: 100;
}


/* =========================================
   TOMBOL CLOSE
========================================= */

.close-btn {
    position: absolute;

    right: 15px;
    top: 15px;

    z-index: 200;

    width: 42px;
    height: 42px;

    border: 1px solid #ff3b81;
    border-radius: 50%;

    background: rgba(0,0,0,.75);

    color: #ff3b81;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    transition: .3s;
}

.close-btn:hover {
    background: #ff3b81;
    color: white;

    box-shadow:
        0 0 25px #ff3b81;

    transform: rotate(90deg);
}


/* =========================================
   AREA SODRON
========================================= */

.scene {
    position: relative;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #fff;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================================
   MY NAME IS
========================================= */

.intro {
    position: absolute;

    z-index: 10;

    text-align: center;

    opacity: 0;

    animation:
        introAnimation
        15s
        ease-in-out
        infinite;
}

.intro span {
    display: block;

    color: #111;

    font-size: clamp(
        18px,
        4vw,
        42px
    );

    font-weight: 300;

    letter-spacing: clamp(
        6px,
        2vw,
        18px
    );

    text-indent: clamp(
        6px,
        2vw,
        18px
    );
}


/* =========================================
   SODRON
========================================= */

.name {
    position: absolute;

    z-index: 9;

    text-align: center;

    opacity: 0;

    animation:
        sodronAnimation
        15s
        cubic-bezier(.12,.8,.2,1)
        infinite;
}

.name h1 {
    position: relative;

    margin: 0;

    color: #080808;

    font-size: clamp(
        55px,
        15vw,
        190px
    );

    font-weight: 1000;

    line-height: .85;

    letter-spacing: clamp(
        2px,
        1vw,
        14px
    );

    text-shadow:
        0 0 5px rgba(0,0,0,.25),
        0 0 20px rgba(0,0,0,.20),
        0 0 50px rgba(0,0,0,.10);
}

.name h1::after {
    content: "SODRON";

    position: absolute;

    inset: 0;

    color: transparent;

    background:
        linear-gradient(
            110deg,
            transparent 20%,
            rgba(255,255,255,.1) 35%,
            #fff 48%,
            rgba(255,255,255,.1) 60%,
            transparent 80%
        );

    background-size: 250% 100%;

    background-clip: text;
    -webkit-background-clip: text;

    animation:
        shine
        2s
        linear
        infinite;
}


/* =========================================
   SHOCKWAVE
========================================= */

.wave {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 30px;
    height: 30px;

    transform:
        translate(-50%, -50%);

    border:
        3px solid #111;

    border-radius: 50%;

    opacity: 0;

    z-index: 4;

    animation:
        waveAnimation
        15s
        ease-out
        infinite;
}

.wave::before {
    content: "";

    position: absolute;

    inset: -5px;

    border:
        2px solid #777;

    border-radius: 50%;

    animation:
        innerWave
        15s
        ease-out
        infinite;
}


/* =========================================
   PARTICLES
========================================= */

.particles {
    position: absolute;

    inset: 0;

    z-index: 5;

    pointer-events: none;
}

.particle {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: #111;

    opacity: 0;

    animation:
        particleAnimation
        15s
        cubic-bezier(.1,.8,.2,1)
        infinite;
}


/* =========================================
   FLASH
========================================= */

.flash {
    position: absolute;

    inset: 0;

    z-index: 20;

    background: white;

    opacity: 0;

    pointer-events: none;

    animation:
        flashAnimation
        15s
        ease-out
        infinite;
}


/* =========================================
   VIGNETTE
========================================= */

.vignette {
    position: absolute;

    inset: 0;

    z-index: 15;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.05) 100%
        );

    opacity: 0;

    animation:
        vignetteAnimation
        15s
        ease-in-out
        infinite;
}


/* =========================================
   ANIMASI INTRO
========================================= */

@keyframes introAnimation {

    0% {
        opacity: 0;
        transform: translateY(30px);
        filter: blur(20px);
    }

    13.33% {
        opacity: 0;
        transform: translateY(30px);
        filter: blur(20px);
    }

    17% {
        opacity: 1;
        transform: translateY(-80px);
        filter: blur(0);
    }

    20%,
    86% {
        opacity: 1;
        transform: translateY(-90px);
        filter: blur(0);
    }

    93% {
        opacity: 0;
        transform: translateY(-125px);
        filter: blur(20px);
    }

    100% {
        opacity: 0;
        transform: translateY(-125px);
        filter: blur(20px);
    }
}


/* =========================================
   ANIMASI SODRON
========================================= */

@keyframes sodronAnimation {

    0% {
        opacity: 0;
        transform:
            scale(.15)
            rotateX(40deg);
        filter: blur(35px);
    }

    13.33% {
        opacity: 0;
        transform:
            scale(.15)
            rotateX(40deg);
        filter: blur(35px);
    }

    17% {
        opacity: 1;
        transform:
            scale(1.18)
            rotateX(0deg);
        filter: blur(0);
    }

    19% {
        transform: scale(.96);
    }

    21% {
        transform: scale(1.03);
    }

    23%,
    86% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }

    93% {
        opacity: 0;
        transform: scale(1.3);
        filter: blur(25px);
    }

    100% {
        opacity: 0;
        transform: scale(1.3);
        filter: blur(25px);
    }
}


/* =========================================
   SHINE
========================================= */

@keyframes shine {

    0% {
        background-position: 150% 0;
    }

    100% {
        background-position: -150% 0;
    }
}


/* =========================================
   WAVE
========================================= */

@keyframes waveAnimation {

    0%,
    13.33% {
        width: 30px;
        height: 30px;
        opacity: 0;
    }

    14% {
        width: 50px;
        height: 50px;
        opacity: .9;
    }

    25% {
        width: 160vw;
        height: 160vw;
        opacity: 0;
    }

    100% {
        opacity: 0;
    }
}

@keyframes innerWave {

    0%,
    13.33% {
        transform: scale(.2);
        opacity: 0;
    }

    14% {
        transform: scale(1);
        opacity: .8;
    }

    25% {
        transform: scale(15);
        opacity: 0;
    }

    100% {
        opacity: 0;
    }
}


/* =========================================
   PARTICLES
========================================= */

@keyframes particleAnimation {

    0%,
    13.33% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.2);
    }

    14% {
        opacity: 1;
    }

    20% {
        opacity: .9;
    }

    35% {
        opacity: 0;

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(0);
    }

    100% {
        opacity: 0;
    }
}


/* =========================================
   FLASH
========================================= */

@keyframes flashAnimation {

    0%,
    13.33% {
        opacity: 0;
    }

    14% {
        opacity: .9;
    }

    15.5% {
        opacity: 0;
    }

    100% {
        opacity: 0;
    }
}


/* =========================================
   VIGNETTE
========================================= */

@keyframes vignetteAnimation {

    0%,
    13.33% {
        opacity: 0;
    }

    18%,
    86% {
        opacity: 1;
    }

    93%,
    100% {
        opacity: 0;
    }
}


/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 600px) {

    .frame {
        width: 96vw;
        height: 75vh;
        border-radius: 15px;
    }

    .name h1 {
        font-size: 17vw;
        letter-spacing: 4px;
    }

    .intro span {
        font-size: 18px;
        letter-spacing: 7px;
        text-indent: 7px;
    }
}
</style>
</head>

<body>

<!-- =========================================
     BUTTON
========================================= -->

<div class="buttons">

    <button
        class="open-btn"
        onclick="openFrame()">
        OPEN
    </button>

    <button
        class="game-btn"
        onclick="openGame()">
        GAMES
    </button>

</div>


<!-- =========================================
     BACKDROP
========================================= -->

<div
    class="backdrop"
    id="backdrop">
</div>


<!-- =========================================
     FRAME SODRON
========================================= -->

<div class="frame" id="frame">

    <button class="close-btn" onclick="closeFrame()">✕</button>

    <div class="scene" id="scene">

        <div class="flash"></div>

        <div class="intro">
            <span>MY NAME IS</span>
        </div>

        <div class="name">
            <h1>SODRON</h1>
        </div>

        <div class="wave"></div>

        <div class="particles" id="particles"></div>

        <div class="vignette"></div>

    </div>

    <iframe
        id="gameFrame"
        src=""
        style="
            display:none;
            width:100%;
            height:100%;
            border:none;
            background:#000;
        ">
    </iframe>

</div>


<script>

/* =========================================
   FRAME CONTROL
========================================= */

const frame = document.getElementById("frame");
const backdrop = document.getElementById("backdrop");
const scene = document.getElementById("scene");
const gameFrame = document.getElementById("gameFrame");

function openFrame() {

    scene.style.display = "flex";
    gameFrame.style.display = "none";
    gameFrame.src = "indexGames.html";

    frame.classList.add("active");
    backdrop.classList.add("active");

    introMusic.currentTime = 0;
    introMusic.play();
}

function closeFrame() {

    frame.classList.remove("active");
    backdrop.classList.remove("active");

    gameFrame.src = "indexGames.html";

    introMusic.pause();
    introMusic.currentTime = 0;
}


/* =========================================
   KLIK LUAR FRAME = CLOSE
========================================= */

backdrop.addEventListener(
    "click",
    closeFrame
);


/* =========================================
   PARTICLES
========================================= */

const particles =
    document.getElementById("particles");


for (let i = 0; i < 150; i++) {

    const particle =
        document.createElement("div");

    particle.className =
        "particle";


    const angle =
        Math.random() *
        Math.PI *
        2;


    const distance =
        150 +
        Math.random() *
        700;


    const x =
        Math.cos(angle) *
        distance;


    const y =
        Math.sin(angle) *
        distance;


    particle.style.setProperty(
        "--x",
        `${x}px`
    );


    particle.style.setProperty(
        "--y",
        `${y}px`
    );


    const size =
        1 +
        Math.random() * 5;


    particle.style.width =
        size + "px";


    particle.style.height =
        size + "px";


    particle.style.animationDelay =
        (Math.random() * .15) + "s";


    particles.appendChild(
        particle
    );
}
</script>
<audio id="introMusic" preload="auto">
    <source src="musik.mp3" type="audio/mpeg">
</audio>
</body>
</html>
