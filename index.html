<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SODRON • XOON</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #05080c;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            overflow: hidden;
            padding: 16px;
        }

        /* ===== CANVAS VISUALIZER ===== */
        #visualizerCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: block;
        }

        /* ===== OVERLAY ===== */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            pointer-events: none;
        }

        .overlay>* {
            pointer-events: auto;
        }

        /* ===== SODRON ===== */
        .brand {
            text-align: center;
            margin-bottom: 6px;
            animation: pulseGlow 3s ease-in-out infinite alternate;
        }

        .brand h1 {
            font-size: clamp(64px, 16vw, 170px);
            font-weight: 900;
            letter-spacing: clamp(4px, 2vw, 16px);
            background: linear-gradient(180deg, #ffffff 40%, #8ac4ff 70%, #ff2d78 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            line-height: 1;
        }

        @keyframes pulseGlow {
            0% {
                filter: brightness(0.9);
            }
            100% {
                filter: brightness(1.3);
            }
        }

        /* ===== TYPING TEXT ===== */
        .typing-container {
            max-width: 640px;
            width: 100%;
            margin: 6px auto 16px auto;
            padding: 0 16px;
        }

        .typing-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: clamp(13px, 1.4vw, 17px);
            font-weight: 300;
            line-height: 1.8;
            text-align: center;
            min-height: 120px;
            letter-spacing: 0.3px;
        }

        .typing-text .highlight {
            color: #00f0ff;
            font-weight: 400;
        }

        .typing-text .highlight-pink {
            color: #ff2d78;
            font-weight: 400;
        }

        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: #00f0ff;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.8s step-end infinite;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        /* ===== EMAIL ===== */
        .email-link {
            color: rgba(255, 255, 255, 0.4);
            font-size: clamp(12px, 1vw, 15px);
            text-decoration: none;
            letter-spacing: 1px;
            transition: 0.3s;
            font-weight: 200;
            margin-top: 2px;
            display: inline-block;
        }

        .email-link:hover {
            color: #00f0ff;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }

        /* ===== TOMBOL ===== */
        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
            max-width: 280px;
            margin-top: 6px;
        }

        .btn {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50px;
            padding: 1.5px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.3), rgba(255, 45, 120, 0.2));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            -webkit-mask-composite: xor;
            pointer-events: none;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
        }
        .btn:active {
            transform: scale(0.97);
        }

        .btn-game {
            color: #ffb3cc;
            text-shadow: 0 0 20px rgba(255, 45, 120, 0.12);
        }
        .btn-game:hover {
            background: rgba(255, 45, 120, 0.06);
            border-color: rgba(255, 45, 120, 0.15);
        }
        .btn-game i {
            color: #ff2d78;
            font-size: 16px;
        }

        .divider {
            width: 30px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
        }

        /* ===== EQUALIZER MINI ===== */
        .equalizer {
            display: flex;
            gap: 3px;
            height: 20px;
            align-items: flex-end;
            margin-top: 8px;
            opacity: 0.3;
        }
        .equalizer .bar {
            width: 4px;
            background: linear-gradient(180deg, #00f0ff, #ff2d78);
            border-radius: 2px;
            transition: height 0.08s ease;
            height: 4px;
        }

        /* ===== BACKDROP & FRAME ===== */
        .backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease;
            z-index: 10;
        }
        .backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .frame {
            position: fixed;
            width: min(94vw, 920px);
            height: min(80vh, 640px);
            overflow: hidden;
            background: #0c121a;
            border-radius: 28px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.04);
            opacity: 0;
            transform: scale(0.85) translateY(20px);
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 20;
        }
        .frame.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .close-btn {
            position: absolute;
            right: 18px;
            top: 18px;
            z-index: 200;
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(6px);
            color: #ff8aa8;
            font-size: 18px;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 45, 120, 0.1);
        }
        .close-btn:hover {
            background: #ff2d78;
            color: #fff;
            box-shadow: 0 0 30px rgba(255, 45, 120, 0.3);
            transform: rotate(90deg);
        }

        #gameFrame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
            z-index: 2;
            display: none;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .frame {
                width: 96vw;
                height: 78vh;
                border-radius: 20px;
            }
            .btn {
                padding: 12px 16px;
                font-size: 13px;
                letter-spacing: 2px;
            }
            .buttons {
                max-width: 240px;
            }
            .close-btn {
                width: 36px;
                height: 36px;
                right: 12px;
                top: 12px;
                font-size: 15px;
            }
            .equalizer .bar {
                width: 3px;
            }
            .typing-text {
                font-size: 13px;
                min-height: 100px;
            }
        }

        @media (max-width: 400px) {
            .btn {
                padding: 10px 12px;
                font-size: 12px;
                letter-spacing: 1.5px;
            }
            .frame {
                height: 70vh;
                border-radius: 16px;
            }
            .brand h1 {
                font-size: 15vw;
            }
            .typing-text {
                font-size: 12px;
                min-height: 90px;
            }
        }

        /* ===== AUDIO INDICATOR ===== */
        .audio-badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 2;
            color: rgba(255, 255, 255, 0.08);
            font-size: 11px;
            letter-spacing: 2px;
            font-weight: 200;
            pointer-events: none;
        }
        .audio-badge i {
            margin-right: 6px;
            color: rgba(0, 240, 255, 0.15);
            animation: beat 1s ease-in-out infinite;
        }
        @keyframes beat {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }
    </style>
</head>
<body>

    <!-- ===== CANVAS VISUALIZER ===== -->
    <canvas id="visualizerCanvas"></canvas>

    <!-- ===== OVERLAY ===== -->
    <div class="overlay">
        <div class="brand">
            <h1>SODRON</h1>
        </div>

        <!-- Typing Text -->
        <div class="typing-container">
            <div class="typing-text" id="typingText">
                <span id="typedContent"></span><span class="cursor-blink"></span>
            </div>
        </div>

        <!-- Email -->
        <a href="mailto:sodron.xoon@gmail.com" class="email-link">
            <i class="fas fa-envelope" style="margin-right:6px;font-size:12px;"></i>
            sodron.xoon@gmail.com
        </a>

        <div class="buttons">
            <div class="divider"></div>
            <button class="btn btn-game" onclick="openGame()">
                <i class="fas fa-gamepad"></i> GAMES
            </button>
        </div>

        <!-- Equalizer mini -->
        <div class="equalizer" id="equalizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </div>

    <div class="audio-badge">
        <i class="fas fa-circle"></i> LIVE
    </div>

    <!-- ===== BACKDROP & FRAME ===== -->
    <div class="backdrop" id="backdrop"></div>

    <div class="frame" id="frame">
        <button class="close-btn" onclick="closeFrame()">
            <i class="fas fa-times"></i>
        </button>
        <iframe id="gameFrame" allow="autoplay; fullscreen"></iframe>
    </div>

    <!-- ===== AUDIO ===== -->
    <audio id="audioPlayer" loop crossorigin="anonymous">
        <source src="musik.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ============================================================
        // 1. TYPING EFFECT
        // ============================================================
        const text =
            'Selamat datang di welcome! Terimakasih sudah mampir ke situs yang gak penting ini, situs ini sebenarnya aku buat untuk pribadi, tapi kalian juga bisa menggunakanNya. intinya situs ini untuk memainkan Game <span class="highlight">xoon</span> dalam posisi offline (tidak online lewat aplikasi xoon).<br><br>kalau kesulitan menemukan Token, bisa hubungi email: <span class="highlight-pink">sodron.xoon@gmail.com</span>';

        const typedContent = document.getElementById('typedContent');
        let charIndex = 0;
        let isTypingComplete = false;

        function typeWriter() {
            if (charIndex < text.length) {
                const char = text.charAt(charIndex);
                if (char === '<') {
                    // Skip HTML tags
                    const endTag = text.indexOf('>', charIndex);
                    typedContent.innerHTML += text.substring(charIndex, endTag + 1);
                    charIndex = endTag + 1;
                } else {
                    typedContent.innerHTML += char;
                    charIndex++;
                }
                setTimeout(typeWriter, 20 + Math.random() * 15);
            } else {
                isTypingComplete = true;
                document.querySelector('.cursor-blink').style.display = 'none';
            }
        }

        // Start typing after 1 second
        setTimeout(typeWriter, 800);

        // ============================================================
        // 2. AUDIO ENGINE
        // ============================================================
        const audio = document.getElementById('audioPlayer');
        let audioCtx = null;
        let analyser = null;
        let dataArray = null;
        let isAudioReady = false;

        function initAudio() {
            if (isAudioReady) return;

            try {
                audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;

                const source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);

                dataArray = new Uint8Array(analyser.frequencyBinCount);
                isAudioReady = true;

                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                audio.play().catch(() => {});
                console.log('🎵 Audio started!');
            } catch (e) {
                console.warn('Audio init error:', e);
            }
        }

        // ===== KLIK DI MANA SAJA UNTUK MULAI =====
        document.addEventListener('click', function firstClick() {
            initAudio();
            document.removeEventListener('click', firstClick);
        });

        // ============================================================
        // 3. CANVAS VISUALIZER
        // ============================================================
        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas.getContext('2d');
        let W, H;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // ===== EQUALIZER MINI (DOM) =====
        const eqBars = document.querySelectorAll('.equalizer .bar');

        function updateEqualizer(level) {
            const scaled = Math.min(level / 128, 1);
            eqBars.forEach((bar, i) => {
                const h = 3 + (scaled * 16) * (0.4 + Math.random() * 0.6);
                bar.style.height = h + 'px';
            });
        }

        // ===== DRAW VISUALIZER =====
        let hueOffset = 0;

        function draw() {
            requestAnimationFrame(draw);

            let avg = 0;
            if (analyser && dataArray) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                avg = sum / dataArray.length;
                updateEqualizer(avg);
                hueOffset += 0.15;
            }

            // Clear
            ctx.clearRect(0, 0, W, H);

            // Background gradient
            const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.7);
            const alpha = 0.02 + (avg / 255) * 0.04;
            grad.addColorStop(0, `rgba(0, 240, 255, ${alpha})`);
            grad.addColorStop(0.5, `rgba(255, 45, 120, ${alpha * 0.5})`);
            grad.addColorStop(1, `rgba(5, 8, 12, 1)`);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // ===== VISUALIZER BARS =====
            if (analyser && dataArray) {
                const bars = 80;
                const barWidth = W / bars;
                const spacing = 2;
                const width = barWidth - spacing;

                for (let i = 0; i < bars; i++) {
                    const idx = Math.floor((i / bars) * dataArray.length);
                    const value = dataArray[idx] || 0;
                    const percent = value / 255;
                    const height = percent * H * 0.35;

                    const x = i * barWidth;
                    const y = H / 2 - height / 2;

                    const hue = (i / bars) * 200 + 200 + Math.sin(hueOffset + i * 0.05) * 20;
                    const lightness = 50 + percent * 30;

                    ctx.fillStyle = `hsl(${hue}, 90%, ${lightness}%)`;
                    ctx.shadowColor = `hsl(${hue}, 90%, 60%)`;
                    ctx.shadowBlur = 10 + percent * 20;
                    ctx.fillRect(x + spacing / 2, y, width, Math.max(height, 2));
                }

                ctx.shadowBlur = 0;

                // ===== CIRCLE WAVE =====
                const centerX = W / 2;
                const centerY = H / 2 + 20;
                const radius = Math.min(W, H) * 0.18 + (avg / 255) * 40;

                for (let ring = 0; ring < 3; ring++) {
                    const r = radius + ring * 25 + (avg / 255) * 15;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
                    ctx.strokeStyle = `hsla(${200 + ring * 30 + hueOffset}, 90%, 70%, ${0.08 + (avg / 255) * 0.15})`;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }

                // Pulse circle
                ctx.beginPath();
                ctx.arc(centerX, centerY, 5 + (avg / 255) * 25, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 240, 255, ${0.1 + (avg / 255) * 0.3})`;
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 30 + (avg / 255) * 60;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // ===== GLITCH EFFECT =====
            if (Math.random() < 0.01) {
                const y = Math.random() * H;
                const h = 2 + Math.random() * 8;
                ctx.fillStyle = `rgba(0, 240, 255, ${0.03 + Math.random() * 0.05})`;
                ctx.fillRect(0, y, W, h);
            }
            if (Math.random() < 0.008) {
                const y = Math.random() * H;
                const h = 2 + Math.random() * 6;
                ctx.fillStyle = `rgba(255, 45, 120, ${0.03 + Math.random() * 0.04})`;
                ctx.fillRect(0, y, W, h);
            }
        }

        draw();

        // ============================================================
        // 4. GAME FUNCTIONS
        // ============================================================
        const frame = document.getElementById('frame');
        const backdrop = document.getElementById('backdrop');
        const gameFrame = document.getElementById('gameFrame');

        // GAMES - musik BERHENTI
        window.openGame = function(e) {
            if (e) e.stopPropagation();

            // HENTIKAN musik
            audio.pause();
            audio.currentTime = 0;

            gameFrame.style.display = 'block';
            gameFrame.src = 'https://xexmxsdrnx.github.io';
            frame.classList.add('active');
            backdrop.classList.add('active');
        };

        // CLOSE - musik lanjut lagi
        window.closeFrame = function() {
            frame.classList.remove('active');
            backdrop.classList.remove('active');
            gameFrame.src = '';
            gameFrame.style.display = 'none';

            // Musik lanjut
            if (!isAudioReady) initAudio();
            if (audio.paused) audio.play().catch(() => {});
        };

        backdrop.addEventListener('click', window.closeFrame);
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') window.closeFrame();
        });

        console.log('🎵 SODRON • XOON READY!');
        console.log('💡 Klik di mana saja untuk mulai audio.');
        console.log('🎮 Klik GAMES → musik berhenti & buka Xoon');
    </script>
</body>
</html>
